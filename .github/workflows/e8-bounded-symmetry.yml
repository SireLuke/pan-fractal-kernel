name: E8 bounded symmetry propagation audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/e8-bounded-symmetry-propagation-v0]
  workflow_dispatch:

jobs:
  e8-bounded-symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run exact bounded symmetry tests
        run: python -m pytest -q tests/test_e8_bounded_symmetry.py
      - name: Run deterministic E8/Gosset audit
        run: PYTHONPATH=. python experiments/e8_bounded_symmetry_audit.py | tee e8_bounded_symmetry_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: e8-bounded-symmetry-audit
          path: e8_bounded_symmetry_audit.json
