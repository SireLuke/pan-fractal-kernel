name: PAN V8 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run geometry and JOBF validation tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests
      - name: Run fast lattice-gauge tests
        run: python -m pytest -q lattice_gauge/tests/test_core_independence.py lattice_gauge/tests/test_gradient_flow.py lattice_gauge/tests/test_topology.py lattice_gauge/tests/test_flow_sector_scan.py
