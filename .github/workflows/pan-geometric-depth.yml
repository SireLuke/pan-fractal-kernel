name: PAN geometric depth engine validation
on:
  push:
    branches: [research/pan-geometric-depth-engine-2026-11-09]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  geometric-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run geometric depth and adjacent geometry tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_pan_geometric_depth.py tests/test_view_ladder.py tests/test_du_val_e8.py
