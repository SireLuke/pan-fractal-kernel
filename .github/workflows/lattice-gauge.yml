name: lattice-gauge
on:
  pull_request:
  push:
    branches-ignore: [main]      # never run release steps from main; merges go through PRs
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # full history: a shallow clone hides the parents of GitHub's synthetic merge commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy scipy
      - name: Independence gate (core imports no PAN module)
        run: python lattice_gauge/tests/test_core_independence.py
      - name: Conformance suite (exact / published reference values)
        run: python lattice_gauge/tests/test_lattice_gauge.py
      - name: Yang-Mills to V8 and Gosset conformance
        run: python -m pytest -q tests/test_yang_mills_v8_gosset.py
      - name: Execute SU(2) and SU(3) through V8 and Gosset
        run: python run_yang_mills_v8_gosset.py --therm 2 --meas 4 --extent 4 --output /tmp/yang_mills_v8_gosset_results.json
      - name: DCO sign-off present on every commit in the PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          bad=$(git log --no-merges --format='%H' origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | while read c; do git show -s --format=%B $c | grep -q '^Signed-off-by:' || echo $c; done)
          test -z "$bad" || { echo "Missing Signed-off-by on: $bad"; exit 1; }
