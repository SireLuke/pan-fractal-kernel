name: wilson-flow-sector-scan
on:
  pull_request:
    paths:
      - "lattice_gauge/gradient_flow.py"
      - "lattice_gauge/topology.py"
      - "run_wilson_flow_sector_scan.py"
      - "lattice_gauge/tests/test_flow_sector_scan.py"
      - ".github/workflows/wilson-flow-sector-scan.yml"
jobs:
  sector-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pytest
      - name: Focused flow tests
        run: python -m pytest -q lattice_gauge/tests/test_gradient_flow.py lattice_gauge/tests/test_flow_sector_scan.py
      - name: Multi-seed SU(2)/SU(3) flow scan
        run: python run_wilson_flow_sector_scan.py --extent 8 --steps 100 --step-size 0.02 --integrator rk3 --seeds 101 202 303 --output wilson_flow_sector_scan.json
        run: python run_wilson_flow_sector_scan.py --extent 8 --steps 100 --step-size 0.02 --integrator rk3 --start thermalized --therm 200 --sep 40 --configs 5 --seeds 101 --output wilson_flow_sector_scan.json
      - name: Upload raw flow trajectories
        uses: actions/upload-artifact@v4
        with:
          name: wilson-flow-sector-scan
          path: wilson_flow_sector_scan.json
          if-no-files-found: error
