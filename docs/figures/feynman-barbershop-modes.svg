<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Growing exponential Barbershop ruler</title><desc id="desc">Five curves y n equals n times two to x; adjacent gap two to x is independent of n.</desc><rect width="960" height="500" fill="#fff"/><text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Unrolled ruler: yₙ(x)=n·2ˣ</text><text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="14">Adjacent spacing Δy=2ˣ, independent of n</text><g transform="translate(100 90)"><rect width="760" height="320" fill="#f8fafc" stroke="#cbd5e1"/><g stroke="#e2e8f0" stroke-dasharray="4 5"><path d="M0 64H760 M0 128H760 M0 192H760 M0 256H760"/><path d="M152 0V320 M304 0V320 M456 0V320 M608 0V320"/></g><path d="M0 320H760 M0 0V320" stroke="#334155" stroke-width="2" fill="none"/><path d="M0 288 C160 282 300 265 420 232 S650 130 760 40" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M0 256 C160 250 300 233 420 200 S650 98 760 8" stroke="#0d9488" stroke-width="4" fill="none"/><path d="M0 224 C160 218 300 201 420 168 S650 66 760 -24" stroke="#7c3aed" stroke-width="4" fill="none"/><path d="M0 192 C160 186 300 169 420 136 S650 34 760 -56" stroke="#ea580c" stroke-width="4" fill="none"/><path d="M0 160 C160 154 300 137 420 104 S650 2 760 -88" stroke="#be123c" stroke-width="4" fill="none"/><g font-family="sans-serif" font-size="14" fill="#334155"><text x="0" y="342">0</text><text x="152" y="342">0.5</text><text x="304" y="342">1</text><text x="456" y="342">1.5</text><text x="608" y="342">2</text><text x="380" y="372">horizontal coordinate x</text></g></g><text x="480" y="455" text-anchor="middle" font-family="sans-serif" font-size="15">For b=2, gap is 1 at x=0 and 4 at x=2.</text></svg>